name: e2e-crosslang

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      [
        "e2e/**",
        "server/**",
        "sdk/js/**",
        "sdk/python/**",
        ".github/workflows/e2e-ci.yml",
      ]
  pull_request:
    paths:
      [
        "e2e/**",
        "server/**",
        "sdk/js/**",
        "sdk/python/**",
        ".github/workflows/e2e-ci.yml",
      ]

permissions:
  contents: read

jobs:
  crosslang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"
          check-latest: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: install python sdk
        run: pip install -e ./sdk/python
      - name: cross-language e2e
        run: ./e2e/crosslang.sh
