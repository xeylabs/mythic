name: sdk-python

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["sdk/python/**", ".github/workflows/sdk-python-ci.yml"]
  pull_request:
    paths: ["sdk/python/**", ".github/workflows/sdk-python-ci.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: install
        run: pip install -e . pytest
      - name: test
        run: python -m pytest tests/ -q
