name: sdk-js

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["sdk/js/**", ".github/workflows/sdk-ci.yml"]
  pull_request:
    paths: ["sdk/js/**", ".github/workflows/sdk-ci.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/js
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: install
        run: bun install --frozen-lockfile
      - name: typecheck
        run: bun run typecheck
      - name: test
        run: bun test
      - name: build
        run: bun run build
