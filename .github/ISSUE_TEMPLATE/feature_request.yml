name: Feature request
description: A new signal, layer, or improvement — behavioral, network, cryptographic.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What attack or friction does this address? Link the threat-model section if it maps to one.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: checkboxes
    id: trust
    attributes:
      label: Trust model check
      description: ADR-0004 — client signals are advisory, never decisive.
      options:
        - label: This proposal keeps every decision server-side
          required: true
